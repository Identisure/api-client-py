[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idkollen-client"
version = "0.1.0"
description = "API client for the IDkollen REST API"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bankid", "eid", "identity", "authentication"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["idkollen_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
