[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identisure-client"
version = "0.1.0"
description = "API client for the Identisure REST API"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bankid", "eid", "identity", "authentication"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "pdoc",
    "pytest>=9.1",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["identisure_client"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# PollOptions is a frozen dataclass, so a shared default instance is safe.
extend-immutable-calls = ["identisure_client._client.PollOptions", "identisure_client.PollOptions"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["identisure_client", "tests"]
