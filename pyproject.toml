[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "identisure-client"
version = "0.1.0"
description = "API client for the Identisure REST API"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bankid", "eid", "identity", "authentication"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pdoc",
    "pytest>=9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["identisure_client"]
